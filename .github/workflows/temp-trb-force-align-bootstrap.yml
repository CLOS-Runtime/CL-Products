name: TEMP TRB force-align bootstrap export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-trb-force-align-bootstrap.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build verified public bootstrap
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub
          mkdir -p stage/model stage/python
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import hashlib
          dest=Path('stage/model')
          snapshot_download(
              repo_id='facebook/wav2vec2-base-960h',
              revision='22aad52',
              local_dir=str(dest),
              allow_patterns=['config.json','preprocessor_config.json','feature_extractor_config.json','tokenizer_config.json','special_tokens_map.json','vocab.json','model.safetensors'],
          )
          p=dest/'model.safetensors'
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert p.stat().st_size == 377607901, p.stat().st_size
          assert h == '8aa76ab2243c81747a1f832954586bc566090c83a0ac167df6f31f0fa917d74a', h
          print('MODEL_IDENTITY_PASS', p.stat().st_size, h)
          PY
          python -m pip install --target stage/python 'transformers==4.56.2' 'safetensors'
          tar -C stage/model -czf trb-force-align-model-22aad52.tar.gz .
          tar -C stage/python -czf trb-force-align-python313-transformers4562.tar.gz .
          sha256sum trb-force-align-*.tar.gz > bootstrap.sha256
      - name: Publish temporary public bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=trb-force-align-bootstrap-ecb30446-temp
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --title "TEMP TRB force-align public bootstrap" --notes "Public pinned model/runtime dependencies only. No episode audio, transcript, or private project data."
          gh release upload "$tag" trb-force-align-model-22aad52.tar.gz trb-force-align-python313-transformers4562.tar.gz bootstrap.sha256 --clobber
